{% extends "base.html" %}

{% block title %}Không tìm thấy trang — SBCB Blog{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center text-center">
        <div class="col-lg-7">
            <div class="display-1 fw-bold text-primary">404</div>
            <h1 class="h3 mt-2">Không tìm thấy trang</h1>
            <p class="text-muted">Đường dẫn bạn truy cập không tồn tại hoặc bài viết đã bị xoá.</p>
            <form method="get" action="{% url 'blog:search' %}" class="row g-2 justify-content-center my-4">
                <div class="col-sm-8">
                    <input type="search" name="q" class="form-control" placeholder="Tìm bài viết..." aria-label="Tìm kiếm">
                </div>
                <div class="col-sm-auto">
                    <button type="submit" class="btn btn-primary w-100">Tìm kiếm</button>
                </div>
            </form>
            <a href="{% url 'home' %}" class="btn btn-outline-primary">Về trang chủ</a>
        </div>
    </div>
</div>
{% endblock %}
