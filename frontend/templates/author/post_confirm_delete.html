{% extends "base.html" %}

{% block title %}Xoá bài viết{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-sm border-danger">
                <div class="card-body p-4">
                    <h1 class="h4 text-danger mb-3"><i class="bi bi-exclamation-triangle me-1"></i>Xoá bài viết</h1>
                    <p>Bạn có chắc muốn xoá bài viết sau? Thao tác này không thể hoàn tác.</p>
                    <div class="alert alert-light border">
                        <strong>{{ object.title }}</strong>
                        <div class="small text-muted mt-1">{{ object.category.name }} · {{ object.updated_at|date:"d/m/Y H:i" }}</div>
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger">Xoá</button>
                            <a href="{% url 'author:post_list' %}" class="btn btn-outline-secondary">Huỷ</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
