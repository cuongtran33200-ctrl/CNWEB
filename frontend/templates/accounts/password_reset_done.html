{% extends "base.html" %}

{% block title %}Đã gửi email — SBCB Blog{% endblock %}

{% block content %}
<div class="container auth-shell">
    <div class="auth-card">
        <div class="auth-head">
            <div class="auth-icon"><i class="bi bi-envelope-check"></i></div>
            <h1>Kiểm tra email</h1>
            <p>Nếu email tồn tại, hướng dẫn đặt lại mật khẩu đã được gửi đến bạn.</p>
        </div>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100">Quay lại đăng nhập</a>
    </div>
</div>
{% endblock %}
