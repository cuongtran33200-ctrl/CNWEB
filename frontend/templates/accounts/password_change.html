{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Đổi mật khẩu — SBCB Blog{% endblock %}

{% block content %}
<div class="container auth-shell">
    <div class="auth-card auth-card-wide">
        <div class="auth-head">
            <div class="auth-icon"><i class="bi bi-shield-lock"></i></div>
            <h1>Đổi mật khẩu</h1>
            <p>Cập nhật mật khẩu để bảo vệ tài khoản</p>
        </div>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form|crispy }}
            <div class="d-flex gap-2 mt-2">
                <button type="submit" class="btn btn-primary flex-grow-1">Cập nhật</button>
                <a href="{% url 'accounts:profile' %}" class="btn btn-outline-secondary">Huỷ</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
