{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Đăng nhập — SBCB Blog{% endblock %}

{% block content %}
<div class="container auth-shell">
    <div class="auth-card">
        <div class="auth-head">
            <div class="auth-icon"><i class="bi bi-person-lock"></i></div>
            <h1>Đăng nhập</h1>
            <p>Chào mừng bạn quay lại SBCB Blog</p>
        </div>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form|crispy }}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-primary w-100 mt-2">Đăng nhập</button>
        </form>
        <div class="text-end mt-3">
            <a href="{% url 'accounts:password_reset' %}">Quên mật khẩu?</a>
        </div>
        <div class="auth-foot">
            Chưa có tài khoản? <a href="{% url 'accounts:register' %}">Đăng ký ngay</a>
        </div>
    </div>
</div>
{% endblock %}
