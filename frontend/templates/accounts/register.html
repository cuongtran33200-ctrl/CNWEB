{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Đăng ký — SBCB Blog{% endblock %}

{% block content %}
<div class="container auth-shell">
    <div class="auth-card auth-card-wide">
        <div class="auth-head">
            <div class="auth-icon"><i class="bi bi-person-plus"></i></div>
            <h1>Tạo tài khoản</h1>
            <p>Tham gia SBCB Blog để bình luận và lưu bài viết</p>
        </div>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-ghost w-100 mt-2">Đăng ký</button>
        </form>
        <div class="auth-foot">
            Đã có tài khoản? <a href="{% url 'accounts:login' %}">Đăng nhập</a>
        </div>
    </div>
</div>
{% endblock %}
