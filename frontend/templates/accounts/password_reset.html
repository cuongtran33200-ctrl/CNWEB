{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Quên mật khẩu — SBCB Blog{% endblock %}

{% block content %}
<div class="container auth-shell">
    <div class="auth-card auth-card-wide">
        <div class="auth-head">
            <div class="auth-icon"><i class="bi bi-envelope-lock"></i></div>
            <h1>Quên mật khẩu?</h1>
            <p>Nhập email để nhận liên kết đặt lại mật khẩu.</p>
        </div>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary w-100 mt-2">Gửi liên kết</button>
        </form>
        <div class="auth-foot">
            Nhớ mật khẩu? <a href="{% url 'accounts:login' %}">Đăng nhập</a>
        </div>
    </div>
</div>
{% endblock %}
