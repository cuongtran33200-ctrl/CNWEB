databases:
  - name: sbcb-blog-db
    plan: free
    databaseName: sbcb_blog
    user: sbcb_blog

services:
  - type: web
    name: sbcb-blog
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: python -m gunicorn config.wsgi:application --chdir backend --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DATABASE_URL
        fromDatabase:
          name: sbcb-blog-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
